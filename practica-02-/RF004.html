    <h2>Cancelación de Cita</h2>
    <p>Cancela una cita agendada con al menos 24 horas de anticipación.</p>

    <form action="" method="post">
        <label for="fechaCita">Fecha de la cita:</label><br>
        <input type="date" id="fechaCita" name="fechaCita" required>

        <br><br>

        <label for="horaCita">Hora de la cita:</label><br>
        <input type="time" id="horaCita" name="horaCita" required>

        <br><br>

        <p>Nota: Si su cita es en menos de 24 horas, el sistema no permitirá la cancelación.</p>

        <button type="submit">Cancelar Cita</button>
    </form>
